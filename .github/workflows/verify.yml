name: Verify file

on:
  push:
    branches:
      - main

jobs:
  verify:
    name: ${{ vars.JOB_NAME }}
    if: ${{ vars.EXECUTE_JOB == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - run: |
          [[ -f ${{ vars.FILE_TO_CHECK }} ]] || ( echo "${{ vars.FILE_TO_CHECK }} file needs to be added to ${{ github.repository }} !" && exit 1 )
