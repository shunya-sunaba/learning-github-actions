name: input-sample.yml

on:
  pull_request:
    branches:
      - main

  workflow_call:
    inputs:
      title:
        required: true
        type: string
      body:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      title:
        description: 'issue title'
        required: true
      body:
        description: 'issue body'
        required: true

jobs:
  create-issue_on_failure:
    runs-on: ubuntu-latest

    permissions:
      issues: write
    steps:
      - name: create issue suing REST API
        run: |
          curl --request POST \
          --url https://api.github.com/repos/${{ github.repository }}/issues \
          --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
          --header 'content-type: application/json' \
          --data '{
            "title": "Failure: ${{ inputs.title }}",
            "body": "Details: ${{ inputs.body }}"
            }' \
          --fail
